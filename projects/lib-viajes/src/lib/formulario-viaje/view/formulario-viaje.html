<app-core-view title="Fomulario Viaje">
  <div body>
    <div class="card" style="width: 100%;">
      @if (loaded) {
        <div class="card-body">
          @if (idViaje) {
            <h5 class="card-title">
              {{ "Viaje: " + data.datosPrincipales.idViaje }}
            </h5>
          }

          <mat-stepper
            [linear]="isLinear"
            (selectedIndexChange)="selectedIndexChange($event)"
            style="background-color: transparent"
            #stepper
          >
            <mat-step
              [label]="'Datos Principales'"
              [stepControl]="datosPrincipales && datosCliente"
            >
              <app-datos-principales
                [formulario]="formulario"
                [readonly]="readonly"
                [idViaje]="idViaje"
              ></app-datos-principales>
            </mat-step>
            <!--  -->
            <mat-step
              [label]="'Datos del Transporte'"
              [stepControl]="datosCamion && datosChofer"
            >
              <app-datos-transporte
                [formulario]="formulario"
                [readonly]="readonly"
                [idViaje]="idViaje"
              ></app-datos-transporte>
            </mat-step>
            <!--  -->
            <mat-step [label]="'Confirmacion'">
              <app-datos-principales
                [formulario]="formulario"
                [readonly]="readonly"
                [idViaje]="idViaje"
              ></app-datos-principales>
              <app-datos-transporte
                [formulario]="formulario"
                [readonly]="readonly"
                [idViaje]="idViaje"
              ></app-datos-transporte>
            </mat-step>
          </mat-stepper>
          <!--  -->
          <div style="padding: 10px;">
            <h6 class="card-subtitle mb-2 text-body-secondary">
              Acciones Rapidas
            </h6>
            <app-acciones-especiales></app-acciones-especiales>
            <div style="margin: 1%;"></div>
            <!--  -->
            <div style="display: flex">
              <div style="margin-right: auto">
                <app-button
                  [label]="'Salir'"
                  (onClick)="salir()"
                  [type]="'danger'"
                ></app-button>
              </div>

              <div style="display: flex; margin-left: auto; gap: 10px">
                @if (stepper.selectedIndex !== 0) {
                  <app-button
                    [label]="'Anterior'"
                    (onClick)="anterior()"
                    [type]="'warning'"
                  ></app-button>
                }

                @if (stepper.selectedIndex !== 2) {
                  <app-button
                    [label]="'Siguiente'"
                    (onClick)="siguiente()"
                    [type]="'info'"
                  ></app-button>
                }

                @if (!readonly) {
                  @if (stepper.selectedIndex === 2 && idViaje) {
                    <app-button
                      [label]="'Guardar'"
                      (onClick)="guardar()"
                      [type]="'success'"
                    ></app-button>
                  } @else if (stepper.selectedIndex === 2) {
                    <app-button
                      [label]="'Guardar'"
                      (onClick)="alta()"
                      [type]="'success'"
                    ></app-button>
                  }
                }
              </div>
            </div>
          </div>
        </div>
      } @else {
        <div class="spinner-overlay">
          <mat-progress-spinner mode="indeterminate" diameter="50">
          </mat-progress-spinner>
        </div>
      }
    </div>
  </div>
</app-core-view>
